<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexel Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 70% 10%, rgba(124, 58, 237, 0.16), transparent 30%),
        #08080d;
      color: #f5f5f7;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR */

    .sidebar {
      width: 270px;
      height: 100vh;
      background: rgba(15, 15, 22, 0.96);
      border-right: 1px solid rgba(255,255,255,0.08);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 800;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      box-shadow: 0 0 25px rgba(139,92,246,0.35);
    }

    .new-chat {
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: white;
      padding: 13px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      text-align: left;
    }

    .new-chat:hover {
      background: rgba(255,255,255,0.09);
    }

    .history-title {
      color: #777783;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    .history-item {
      padding: 11px;
      border-radius: 10px;
      color: #b8b8c4;
      font-size: 14px;
      cursor: pointer;
    }

    .history-item:hover {
      background: rgba(255,255,255,0.05);
      color: white;
    }

    .profile {
      margin-top: auto;
      padding: 12px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: #bdbdc8;
      font-size: 13px;
    }

    /* MAIN */

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .topbar {
      height: 68px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(8,8,13,0.72);
      backdrop-filter: blur(15px);
    }

    .chat-title {
      font-size: 16px;
      font-weight: 700;
    }

    .mode {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 9px 13px;
      border-radius: 10px;
      color: #dddde5;
      font-size: 13px;
    }

    .mode-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 0 10px #8b5cf6;
    }

    /* CHAT AREA */

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 140px;
    }

    .welcome {
      max-width: 700px;
      margin: 90px auto 0;
      text-align: center;
    }

    .welcome-icon {
      width: 65px;
      height: 65px;
      margin: auto;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 28px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      box-shadow: 0 0 45px rgba(139,92,246,0.25);
    }

    .welcome h1 {
      margin-top: 22px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .welcome p {
      margin-top: 12px;
      color: #858591;
      line-height: 1.6;
    }

    /* MESSAGES */

    .messages {
      max-width: 850px;
      margin: auto;
    }

    .message {
      display: flex;
      gap: 13px;
      margin-bottom: 25px;
      animation: appear 0.25s ease;
    }

    .message.user {
      justify-content: flex-end;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.07);
      font-size: 14px;
    }

    .bubble {
      max-width: 75%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.55;
      font-size: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
    }

    .user .bubble {
      background: #6d3bd1;
      border-color: transparent;
    }

    /* INPUT */

    .input-wrapper {
      position: fixed;
      bottom: 20px;
      left: 290px;
      right: 20px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .input-box {
      width: min(850px, 100%);
      pointer-events: auto;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 11px;
      background: rgba(20,20,29,0.94);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.35);
      backdrop-filter: blur(20px);
    }

    .attach {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 11px;
      background: rgba(255,255,255,0.06);
      color: #aaaab5;
      cursor: pointer;
      font-size: 18px;
    }

    textarea {
      flex: 1;
      resize: none;
      max-height: 120px;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 14px;
      line-height: 1.5;
      padding: 10px 3px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #70707b;
    }

    .send {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      cursor: pointer;
      font-size: 18px;
    }

    .send:hover {
      transform: translateY(-1px);
      box-shadow: 0 5px 20px rgba(139,92,246,0.3);
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* MOBILE */

    @media (max-width: 750px) {
      .sidebar {
        display: none;
      }

      .topbar {
        padding: 0 15px;
      }

      .input-wrapper {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }

      .chat-area {
        padding-left: 12px;
        padding-right: 12px;
      }

      .bubble {
        max-width: 85%;
      }

      .welcome {
        margin-top: 60px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-mark">N</div>
      Nexel
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New Chat
    </button>

    <div class="history-title">Today</div>

    <div class="history-item">
      New conversation
    </div>

    <div class="history-item">
      Nexel project
    </div>

    <div class="history-item">
      Random ideas
    </div>

    <div class="profile">
      👤 Guest<br>
      <span style="color:#777783;">Free Plan</span>
    </div>

  </aside>


  <main class="main">

    <header class="topbar">

      <div class="chat-title">
        Nexel Chat
      </div>

      <div class="mode">
        <span class="mode-dot"></span>
        Buddy
      </div>

    </header>


    <section class="chat-area" id="chatArea">

      <div class="welcome" id="welcome">

        <div class="welcome-icon">
          N
        </div>

        <h1>
          What are we building today?
        </h1>

        <p>
          Talk to Nexel, ask questions, write code,
          brainstorm ideas, or just chat.
        </p>

      </div>

      <div class="messages" id="messages"></div>

    </section>


    <div class="input-wrapper">

      <div class="input-box">

        <button class="attach" title="Attach file">
          ＋
        </button>

        <textarea
          id="prompt"
          rows="1"
          placeholder="Message Nexel..."
        ></textarea>

        <button class="send" onclick="sendMessage()">
          ↑
        </button>

      </div>

    </div>

  </main>


  <script>

    const promptBox = document.getElementById("prompt");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");

    promptBox.addEventListener("input", () => {
      promptBox.style.height = "auto";
      promptBox.style.height =
        Math.min(promptBox.scrollHeight, 120) + "px";
    });

    promptBox.addEventListener("keydown", (event) => {

      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }

    });


    function sendMessage() {

      const text = promptBox.value.trim();

      if (!text) return;

      welcome.style.display = "none";

      const message = document.createElement("div");

      message.className = "message user";

      message.innerHTML = `
        <div class="bubble">${escapeHTML(text)}</div>
        <div class="avatar">👤</div>
      `;

      messages.appendChild(message);

      promptBox.value = "";
      promptBox.style.height = "auto";

      messages.scrollIntoView({
        behavior: "smooth",
        block: "end"
      });

      // Temporary response.
      setTimeout(() => {

        const response = document.createElement("div");

        response.className = "message";

        response.innerHTML = `
          <div class="avatar">N</div>
          <div class="bubble">
            I'm here 👀<br><br>
            The Nexel AI backend isn't connected yet.
            We're building that next.
          </div>
        `;

        messages.appendChild(response);

        response.scrollIntoView({
          behavior: "smooth",
          block: "end"
        });

      }, 600);

    }


    function newChat() {

      messages.innerHTML = "";
      welcome.style.display = "block";
      promptBox.value = "";
      promptBox.style.height = "auto";

    }


    function escapeHTML(text) {

      const div = document.createElement("div");
      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
    </html>
